name: Lint, Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  MSRV:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      MSRV: 1.87.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - name: Check build with MSRV
        run: |
          cargo --locked check
          cargo --locked check --no-default-features --features tokio
          cargo --locked check --all-features

  fmt:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # We use some nightly fmt options.
          toolchain: nightly
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo --locked fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Catch common mistakes
        run: |
          cargo --locked clippy --all-targets
          cargo --locked clippy --all-targets --no-default-features --features tokio
          cargo --locked clippy --all-targets --all-features

  test:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: full
      RUST_LOG: trace
      # Fail instead of quietly falling back to the in-process mock, so this job really does
      # exercise the daemon installed below.
      ZBUS_POLKIT_REQUIRE_REAL: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install polkit
        run: |
          sudo apt-get update
          sudo apt-get install -y polkitd
          sudo systemctl start polkit.service
      - name: Test default features (async-io + blocking-api)
        run: cargo --locked test
      - name: Test tokio without blocking-api
        run: cargo --locked test --no-default-features --features tokio
      - name: Test all features (async-io + tokio + blocking-api)
        run: cargo --locked test --all-features
      - name: Test against the mock Authority
        # The daemon cannot be driven into every state the proxy has to handle, so the mock covers
        # the rest: the `uid` type on the wire and the `Changed` signal.
        run: cargo --locked test --all-features --test authority
        env:
          ZBUS_POLKIT_MOCK: 1

  test_nightly:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: full
      RUST_LOG: trace
      # Fail instead of quietly falling back to the in-process mock, so this job really does
      # exercise the daemon installed below.
      ZBUS_POLKIT_REQUIRE_REAL: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install polkit
        run: |
          sudo apt-get update
          sudo apt-get install -y polkitd
          sudo systemctl start polkit.service
      - name: Test on nightly Rust
        run: cargo --locked test --all-features

  doc_build:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation build
        run: cargo --locked doc --all-features --no-deps

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
