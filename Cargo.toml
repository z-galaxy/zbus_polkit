[package]
name = "zbus_polkit"
version = "6.0.0"
authors = [
    "Marc-André Lureau <marcandre.lureau@redhat.com>",
    "Zeeshan Ali Khan <zeenix@gmail.com>",
]
edition = "2021"
rust-version = "1.89"

description = "PolicyKit binding"
repository = "https://github.com/z-galaxy/zbus_polkit/"
keywords = ["D-Bus", "DBus", "IPC"]
license = "MIT"
categories = ["os::unix-apis"]
readme = "README.md"

[features]
default = ["zbus/default-rt", "agent"]
tokio = ["zbus/tokio"]
# Being an authentication agent takes zbus's object server, which nothing else here needs.
agent = ["zbus/service"]

[dependencies]
zbus = { version = "6.0.0", default-features = false, features = [
    "proxy",
] }
serde = { version = "1.0.200", features = ["derive"] }
serde_repr = "0.1.19"
bitflags = "2.13.2"
static_assertions = "1.1.0"

[dev-dependencies]
byteorder = "1.5.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The README example opens a pidfd for the current process.
rustix = { version = "1", features = ["process"] }
# A self-describing format, to check `Subject` decodes from a map as well as a sequence.
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
# The tests stand up an object server over a p2p connection, which the library itself does not
# need.
zbus = { version = "6.0.0", default-features = false, features = [
    "p2p",
    "service",
] }
