[package]
name = "zbus_polkit"
version = "6.0.0"
authors = [
    "Marc-André Lureau <marcandre.lureau@redhat.com>",
    "Zeeshan Ali Khan <zeenix@gmail.com>",
]
edition = "2021"
rust-version = "1.87"

description = "PolicyKit binding"
repository = "https://github.com/z-galaxy/zbus_polkit/"
keywords = ["D-Bus", "DBus", "IPC"]
license = "MIT"
categories = ["os::unix-apis"]
readme = "README.md"

[features]
default = ["zbus/async-io", "blocking-api"]
tokio = ["zbus/tokio"]
blocking-api = ["zbus/blocking-api"]

[dependencies]
# zbus 6 is unreleased; this has to point at git until it is on crates.io.
zbus = { git = "https://github.com/z-galaxy/zbus", version = "6.0.0", default-features = false, features = [
    "proxy",
] }
serde = { version = "1.0.200", features = ["derive"] }
serde_repr = "0.1.19"
enumflags2 = { version = "0.7.9", features = ["serde"] }
static_assertions = "1.1.0"

[dev-dependencies]
byteorder = "1.5.0"
# A self-describing format, to check `Subject` round-trips through one.
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "time",
] }
# The tests stand up an object server over a p2p connection, which the library itself does not
# need. Same git source as the dependency above.
zbus = { git = "https://github.com/z-galaxy/zbus", version = "6.0.0", default-features = false, features = [
    "p2p",
    "service",
] }
